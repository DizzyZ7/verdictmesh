name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "ruff>=0.9,<1"
      - run: ruff check .
      - run: pip install -e ".[dev]"
      - run: pip check
      - run: mypy src
      - run: pytest
      - run: DATABASE_URL=sqlite+pysqlite:///./migration-test.db alembic upgrade head
      - run: DATABASE_URL=sqlite+pysqlite:///./migration-test.db alembic downgrade base

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag verdictmesh:ci .
